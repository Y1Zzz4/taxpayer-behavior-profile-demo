[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taxpayer-behavior-profile-demo"
version = "0.1.0"
description = "A demonstration prototype for phone-level taxpayer behavior profiles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42,<47",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

